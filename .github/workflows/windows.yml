# Windows build: freezes the app on MSYS2 (UCRT64) and wraps it in an NSIS installer.
name: Windows

on:
  push:
    branches:
      - main
      - "windows/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  models:
    # The quality-tier models are exported from the YOLO weights once per build;
    # the export toolchain (torch) never ships in the installer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Export models
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install "ultralytics>=8.4.123" onnx onnxslim
          mkdir -p models
          for tier in n s m; do
            python scripts/export_onnx.py "yolo26${tier}.pt" --imgsz 640 --output-dir models
          done
          ls -l models
      - uses: actions/upload-artifact@v5
        with:
          name: models
          path: models/*.onnx

  build:
    needs: models
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugin-gtk
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-opencv
            mingw-w64-ucrt-x86_64-python-onnxruntime
            mingw-w64-ucrt-x86_64-python-pygame
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-python-packaging
            mingw-w64-ucrt-x86_64-python-cffi
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-nsis

      - uses: actions/download-artifact@v5
        with:
          name: models
          path: packaging/windows/_build/models

      # gcc builds the few sdist-only dependencies (netifaces for multicast-expert).
      - name: Install AutoFollow and its Python dependencies
        run: |
          python --version
          pip install --break-system-packages --ignore-requires-python --no-deps .
          pip install --break-system-packages \
            "pypsn @ git+https://github.com/open-stage/python-psn.git" \
            "tomli-w>=1.0" "bottle>=0.12" "multicast-expert>=1.4" "python-osc>=1.10.2" \
            "mido>=1.3" "mistune>=3.3.4"

      - name: Check the native Python packages import
        run: |
          pacman -Ql mingw-w64-ucrt-x86_64-python-onnxruntime | grep -iE 'pybind|\.pyd$|\.dll$' || true
          pacman -Q mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-onnxruntime mingw-w64-ucrt-x86_64-onnxruntime || true
          python -c "import sys; print(sys.version); import importlib.machinery as m; print(m.EXTENSION_SUFFIXES)"
          python -c "import cv2, numpy; print('cv2', cv2.__version__)"
          python -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__)"

      - name: Freeze
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/windows/autofollow.spec

      - name: Self-check the frozen app
        run: |
          OPENFOLLOW_SELFCHECK=1 OPENFOLLOW_SELFCHECK_OUT="$PWD/selfcheck.txt" ./dist/AutoFollow/AutoFollow.exe; rc=$?
          cat selfcheck.txt || true
          [ $rc -eq 0 ] || find dist/AutoFollow -ipath '*onnxruntime*' | head -50
          exit $rc

      - name: Build installer
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          makensis -DVERSION="$version" -DSRC="$(cygpath -w "$PWD/dist/AutoFollow")" -DLICENSE="$(cygpath -w "$PWD/LICENSE")" packaging/windows/installer.nsi
          mkdir -p out && mv packaging/windows/AutoFollow-*-Setup.exe out/
          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: AutoFollow-Windows-Setup
          path: out/*.exe

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" out/*.exe --clobber -R "${GITHUB_REPOSITORY}" || gh release create "${GITHUB_REF_NAME}" out/*.exe -R "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
